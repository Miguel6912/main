name: Deploy Wayfarer to GitHub Pages

on:
  push:
    branches: [claude/game-ideas-brainstorm-b7dwic]
    paths: ['wayfarer/**']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wayfarer
      - id: deployment
        uses: actions/deploy-pages@v4
